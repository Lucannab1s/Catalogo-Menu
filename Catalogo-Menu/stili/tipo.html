<!doctype html>
<html lang="it" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menù: stile Solo tipografia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/kit.css">
<style>
  /* SOLO TIPOGRAFIA: un solo carattere variabile. La riga sotto il puntatore prende peso e larghezza,
     la foto del piatto la segue con una molla. Bricolage Grotesque, nero fuliggine e lime. */
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --ink: #ffffff; --muted: #a3a3a3; --lime: #dafa9c; --lime-ink: #0f0f0f;
    --m: clamp(16px, 2.2vw, 32px); --gap: clamp(12px, 1.6vw, 24px);
    --small: 0.9375rem; --body: clamp(1.0625rem, 1rem + 0.2vw, 1.1875rem);
    --lead: clamp(1.375rem, 1.1rem + 0.8vw, 2rem); --head: clamp(2.5rem, 0.8rem + 4vw, 4.5rem);
    --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  }
  body { background: var(--bg); color: var(--ink); font: 400 var(--body)/1.5 "Bricolage Grotesque", system-ui, sans-serif; font-variation-settings: "opsz" 14; }

  .top { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: end; padding: clamp(56px, 12svh, 140px) var(--m) clamp(48px, 8svh, 96px); }
  .top h1 { grid-column: 1 / span 8; font-size: clamp(3.25rem, 1rem + 8vw, 9.5rem); font-weight: 800; font-variation-settings: "opsz" 96, "wdth" 75; letter-spacing: -0.04em; line-height: 0.88; }
  .top__side { grid-column: 9 / span 4; display: grid; gap: 16px; }
  .top__side p:first-child { font-size: var(--lead); line-height: 1.15; font-weight: 600; color: var(--lime); }
  .jump { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 28px; margin-top: 40px; }
  .jump a { font-size: var(--lead); font-weight: 600; text-decoration: none; transition: color 0.2s; }
  .jump a:hover { color: var(--lime); }

  .cat { padding: 0 var(--m); }
  .cat + .cat { margin-top: clamp(80px, 12svh, 140px); }
  .cat h2 { font-size: var(--lead); font-weight: 700; color: var(--lime); margin-bottom: 18px; }
  .dish { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: baseline; padding: 12px 0 26px; cursor: default; }
  .dish__head { grid-column: 1 / span 8; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: clamp(16px, 2vw, 32px); }
  .dish h3 { font-size: var(--head); font-weight: 400; font-variation-settings: "opsz" 96, "wght" 220, "wdth" 75; letter-spacing: -0.035em; line-height: 0.98; }
  .dish__price { font-size: var(--lead); font-weight: 700; color: var(--lime); font-variant-numeric: tabular-nums; }
  .dish__desc { grid-column: 9 / span 4; color: var(--ink); }
  .dish__pic { display: none; }

  /* la foto che segue il puntatore */
  .float { position: fixed; left: 0; top: 0; z-index: 20; width: clamp(220px, 20vw, 320px); aspect-ratio: 4 / 5; pointer-events: none; opacity: 0; transition: opacity 0.3s; will-change: transform; }
  .float.on { opacity: 1; }
  .float img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.25s; }
  .float img.on { opacity: 1; }

  .close { margin-top: clamp(120px, 16svh, 200px); background: var(--lime); color: var(--lime-ink); padding: clamp(64px, 10svh, 120px) var(--m) var(--m); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 28px; }
  .close__name { grid-column: 1 / -1; font-size: clamp(3rem, 1rem + 9vw, 10.5rem); font-weight: 800; font-variation-settings: "opsz" 96, "wdth" 75; letter-spacing: -0.04em; line-height: 0.88; }
  .close p:nth-of-type(2) { grid-column: 1 / span 4; font-size: var(--lead); font-weight: 600; }
  .close p:nth-of-type(3) { grid-column: 7 / span 6; max-width: 52ch; }

  @media (max-width: 1100px) { .top h1, .top__side { grid-column: 1 / -1; } .top__side { margin-top: 24px; } .dish h3 { white-space: normal; } .dish__head, .dish__desc { grid-column: 1 / -1; } .dish__desc { margin-top: 8px; max-width: 58ch; } }
  @media (max-width: 760px) {
    .dish h3 { font-size: 2.5rem; }
    .float { display: none; }
    .dish__pic { grid-column: 1 / -1; margin-top: 14px; }
    .dish__pic img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .dish.on .dish__pic { display: block; animation: open 0.5s var(--ease); }
    .close p:nth-of-type(2), .close p:nth-of-type(3) { grid-column: 1 / -1; }
  }
  @keyframes open { from { opacity: 0; transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .float, .float img { transition: none; } .dish.on .dish__pic { animation: none; } }
</style>
</head>
<body>
<a class="skip" href="#antipasti">Salta al menù</a>
<main>
  <header class="top">
    <h1 data-name data-rise></h1>
    <div class="top__side">
      <p data-line data-rise></p>
      <p data-note data-rise></p>
    </div>
    <nav class="jump" aria-label="Portate" data-jump></nav>
  </header>
  <div data-cats></div>
</main>
<div class="float" data-float aria-hidden="true"></div>
<footer class="close">
  <p class="close__name" data-name></p>
  <p data-cover></p>
  <p data-note></p>
</footer>
<noscript><p style="padding:24px">Questo menù si compone con JavaScript.</p></noscript>
<script src="../js/menu.js"></script>
<script src="../api/menu.js?stile=tipo"></script>
<script src="../js/kit.js"></script>
<script>
(function () {
  'use strict';
  const M = window.MENU, h = K.h, $ = (s) => document.querySelector(s);
  document.querySelectorAll('[data-name]').forEach((e) => (e.textContent = M.ristorante));
  document.querySelectorAll('[data-note]').forEach((e) => (e.textContent = M.nota));
  $('[data-line]').textContent = M.stagione + ' · ' + M.luogo;
  $('[data-cover]').textContent = 'Coperto ' + K.euro2(M.coperto);

  const host = $('[data-cats]'), jump = $('[data-jump]'), float = $('[data-float]');
  const rows = [];
  M.categorie.forEach((c) => {
    jump.append(h('a', { href: '#' + c.id, text: c.nome }));
    host.append(h('section', { class: 'cat', id: c.id, 'aria-labelledby': 'h-' + c.id },
      h('h2', { id: 'h-' + c.id, 'data-rise': true, text: c.nome }),
      h('ul', {}, c.piatti.map((p) => {
        const big = K.photo(p, ''); float.append(big);
        const name = h('h3', { text: p.nome });
        const li = h('li', { class: 'dish', 'data-rise': true }, h('div', { class: 'dish__head' }, name, h('p', { class: 'dish__price', text: K.euro(p.prezzo) })),
          h('p', { class: 'dish__desc', text: p.desc + (p.tag.length ? ' ' + p.tag.map((t) => K.tagNames[t]).join(' · ') + '.' : '') }),
          h('figure', { class: 'dish__pic' }, K.photo(p, '')));
        rows.push({ li, name, big, w: 220, x: 75 });
        return li;
      }))));
  });

  // peso e larghezza seguono la distanza dal puntatore (o dal centro dello schermo, se non c'è un mouse)
  const spring = { x: innerWidth / 2, y: innerHeight / 2, vx: 0, vy: 0 };
  let active = null;
  K.add(null, () => {
    const ptr = K.pointer, mouse = !K.coarse && K.recent(2500);
    const fy = mouse ? ptr.y : innerHeight * 0.5;
    let best = null, bd = 1e9;
    for (const r of rows) {
      const b = r.name.getBoundingClientRect();
      if (b.bottom < -200 || b.top > innerHeight + 200) continue;
      const d = Math.abs(b.top + b.height / 2 - fy);
      if (d < bd) { bd = d; best = r; }
      const near = Math.exp(-(d * d) / (2 * Math.pow(innerHeight * 0.09, 2)));
      const tw = 220 + 520 * near, tx = 75 + 17 * near;
      r.w += (tw - r.w) * (K.reduced ? 1 : 0.14); r.x += (tx - r.x) * (K.reduced ? 1 : 0.14);
      const v = '"opsz" 96, "wght" ' + Math.round(r.w) + ', "wdth" ' + r.x.toFixed(1);
      if (r.__v !== v) { r.__v = v; r.name.style.fontVariationSettings = v; }
    }
    const hit = best && bd < 70 ? best : null;
    if (hit !== active) {
      if (active) { active.big.classList.remove('on'); active.li.classList.remove('on'); }
      active = hit;
      if (active) { active.big.classList.add('on'); active.li.classList.add('on'); }
    }
    float.classList.toggle('on', !!active && mouse);
    // la foto insegue il puntatore con una molla
    const tx = ptr.x + 32, ty = ptr.y - float.offsetHeight / 2;
    spring.vx = (spring.vx + (tx - spring.x) * 0.12) * 0.72; spring.vy = (spring.vy + (ty - spring.y) * 0.12) * 0.72;
    spring.x += spring.vx; spring.y += spring.vy;
    const maxX = innerWidth - float.offsetWidth - 16;
    const x = spring.x > maxX ? ptr.x - float.offsetWidth - 32 + (spring.x - tx) : spring.x;
    float.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + K.clamp(spring.y, 16, innerHeight - float.offsetHeight - 72).toFixed(1) + 'px,0) rotate(' + K.clamp(spring.vx * 0.25, -8, 8).toFixed(2) + 'deg)';
  });
  K.bar('tipo');
  K.reveal();
})();
</script>
</body>
</html>
