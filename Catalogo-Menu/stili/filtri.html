<!doctype html>
<html lang="it" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menù: stile Filtri animati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/kit.css">
<style>
  /* FILTRI ANIMATI: portata, dieta, prezzo e ricerca. Ogni cambio passa per startViewTransition:
     il browser fotografa prima e dopo e fa scivolare ogni piatto al suo posto. Albert Sans, cobalto su sabbia. */
  :root {
    --bg: #e6dbc7; --surface: #ddd0b9; --ink: #062b8a; --muted: #2c4b9a; --field: #062b8a; --field-ink: #e6dbc7;
    --m: clamp(16px, 2.2vw, 32px); --gap: clamp(12px, 1.6vw, 24px);
    --small: 0.9375rem; --body: clamp(1.0625rem, 1rem + 0.2vw, 1.1875rem);
    --lead: clamp(1.375rem, 1.1rem + 0.7vw, 1.875rem); --head: clamp(3rem, 1rem + 7vw, 8rem);
    --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  }
  body { background: var(--bg); color: var(--ink); font: 400 var(--body)/1.5 "Albert Sans", system-ui, sans-serif; }
  .top { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: end; padding: clamp(48px, 10svh, 120px) var(--m) clamp(32px, 5svh, 56px); }
  .top h1 { grid-column: 1 / span 8; font-size: var(--head); font-weight: 600; letter-spacing: -0.045em; line-height: 0.92; }
  .top p { grid-column: 9 / span 4; font-size: var(--lead); line-height: 1.2; font-weight: 500; }

  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px var(--m); background: var(--field); color: var(--field-ink); }
  .group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #1d3f99; color: var(--field-ink); cursor: pointer; font-weight: 500; transition: background-color 0.2s, color 0.2s, transform 0.2s var(--ease); }
  .chip:hover { background: #2a4ea8; }
  .chip:active { transform: scale(0.95); }
  .chip[aria-pressed="true"] { background: var(--field-ink); color: var(--field); }
  .bar label { font-size: var(--small); }
  .bar select, .bar input { min-height: 40px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--field-ink); color: var(--field); font: 500 var(--small) "Albert Sans", system-ui, sans-serif; }
  .bar input { width: min(260px, 100%); }
  .count { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }

  .list { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 3vw, 40px) var(--gap); padding: clamp(40px, 6svh, 72px) var(--m) clamp(120px, 16svh, 200px); }
  .dish { display: grid; grid-template-columns: 42% 1fr; gap: 20px; align-items: start; }
  .dish[hidden] { display: none; }
  .dish__pic { overflow: hidden; }
  .dish img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transition: transform 0.6s var(--ease); }
  .dish:hover img { transform: scale(1.06); }
  .dish__cat { font-size: var(--small); color: var(--muted); font-weight: 500; }
  .dish h3 { font-size: var(--lead); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin: 2px 0 8px; }
  .dish__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: var(--small); font-weight: 500; }
  .dish__tags span { padding: 2px 10px; border-radius: 999px; background: var(--surface); }
  .dish__price { margin-top: 10px; font-size: var(--lead); font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty { grid-column: 1 / -1; display: grid; gap: 18px; justify-items: start; padding: 48px 0; }
  .empty[hidden] { display: none; }
  .empty p { font-size: var(--lead); font-weight: 600; }
  .btn { min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--field); color: var(--field-ink); font-weight: 600; cursor: pointer; }

  ::view-transition-group(*) { animation-duration: 0.55s; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
  html.vt-local::view-transition-old(root), html.vt-local::view-transition-new(root) { animation: none; }

  .close { background: var(--field); color: var(--field-ink); padding: clamp(64px, 10svh, 120px) var(--m) var(--m); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 28px; }
  .close__name { grid-column: 1 / -1; font-size: clamp(3rem, 1rem + 9vw, 10rem); font-weight: 600; letter-spacing: -0.045em; line-height: 0.92; }
  .close p:nth-of-type(2) { grid-column: 1 / span 4; font-size: var(--lead); font-weight: 600; }
  .close p:nth-of-type(3) { grid-column: 7 / span 6; max-width: 52ch; }

  @media (max-width: 1100px) { .top h1, .top p { grid-column: 1 / -1; } .top p { margin-top: 20px; } .list { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    .bar { position: relative; }
    .count { margin-left: 0; }
    .dish { grid-template-columns: 1fr; gap: 12px; }
    .close p:nth-of-type(2), .close p:nth-of-type(3) { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { .chip, .dish img { transition: none; } }
</style>
</head>
<body>
<a class="skip" href="#piatti">Salta al menù</a>
<main>
  <header class="top">
    <h1 data-name data-rise></h1>
    <p data-line data-rise></p>
  </header>
  <form class="bar" aria-label="Filtra il menù" onsubmit="return false" data-bar>
    <div class="group" role="group" aria-label="Portata" data-cats></div>
    <div class="group" role="group" aria-label="Dieta">
      <button class="chip" type="button" aria-pressed="false" data-diet="v">Vegetariano</button>
      <button class="chip" type="button" aria-pressed="false" data-diet="gf">Senza glutine</button>
    </div>
    <label>Ordina <select data-sort><option value="menu">come nel menù</option><option value="up">prezzo crescente</option><option value="down">prezzo decrescente</option></select></label>
    <label>Cerca <input type="search" data-q placeholder="carbonara, limone…" autocomplete="off"></label>
    <p class="count" aria-live="polite" data-count></p>
  </form>
  <section class="list" id="piatti" aria-label="Piatti" data-list>
    <div class="empty" hidden data-empty><p>Nessun piatto con questi filtri.</p><button class="btn" type="button" data-reset>Togli i filtri</button></div>
  </section>
</main>
<footer class="close">
  <p class="close__name" data-name></p>
  <p data-cover></p>
  <p data-note></p>
</footer>
<noscript><p style="padding:24px">Questo menù si compone con JavaScript.</p></noscript>
<script src="../js/menu.js"></script>
<script src="../api/menu.js?stile=filtri"></script>
<script src="../js/kit.js"></script>
<script>
(function () {
  'use strict';
  const M = window.MENU, h = K.h, $ = (s) => document.querySelector(s);
  document.querySelectorAll('[data-name]').forEach((e) => (e.textContent = M.ristorante));
  $('[data-line]').textContent = M.stagione + '. Scegli la portata, la dieta o cerca un ingrediente: i piatti si riordinano da soli.';
  $('[data-cover]').textContent = 'Coperto ' + K.euro2(M.coperto);
  $('[data-note]').textContent = M.nota;

  const all = K.all(), list = $('[data-list]'), empty = $('[data-empty]');
  const items = all.map((p, i) => {
    const el = h('article', { class: 'dish', style: 'view-transition-name: d-' + p.id },
      h('div', { class: 'dish__pic' }, K.photo(p, '')),
      h('div', { 'data-rise': true }, h('p', { class: 'dish__cat', text: p.cat.nome }), h('h3', { text: p.nome }), h('p', { text: p.desc }),
        p.tag.length ? h('p', { class: 'dish__tags' }, p.tag.map((t) => h('span', { text: K.tagNames[t] }))) : null,
        h('p', { class: 'dish__price', text: K.euro(p.prezzo) })));
    list.insertBefore(el, empty);
    return { p, el, i, text: (p.nome + ' ' + p.desc + ' ' + p.cat.nome).toLowerCase() };
  });

  const state = { cat: 'all', diet: new Set(), sort: 'menu', q: '' };
  const cats = $('[data-cats]');
  [{ id: 'all', nome: 'Tutto' }].concat(M.categorie).forEach((c) => {
    const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': String(c.id === 'all'), 'data-cat': c.id, text: c.nome });
    b.addEventListener('click', () => { state.cat = c.id; cats.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); run(); });
    cats.append(b);
  });
  document.querySelectorAll('[data-diet]').forEach((b) => b.addEventListener('click', () => {
    const d = b.dataset.diet; if (state.diet.has(d)) state.diet.delete(d); else state.diet.add(d);
    b.setAttribute('aria-pressed', String(state.diet.has(d))); run();
  }));
  $('[data-sort]').addEventListener('change', (e) => { state.sort = e.target.value; run(); });
  let qT = 0;
  $('[data-q]').addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); run(); }, 180); });
  $('[data-reset]').addEventListener('click', () => {
    state.cat = 'all'; state.diet.clear(); state.sort = 'menu'; state.q = '';
    cats.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.cat === 'all')));
    document.querySelectorAll('[data-diet]').forEach((x) => x.setAttribute('aria-pressed', 'false'));
    $('[data-sort]').value = 'menu'; $('[data-q]').value = ''; run();
  });

  function apply() {
    const shown = items.filter((it) => (state.cat === 'all' || it.p.cat.id === state.cat) && [...state.diet].every((d) => it.p.tag.includes(d)) && (!state.q || it.text.includes(state.q)));
    const order = shown.slice().sort((a, b) => state.sort === 'up' ? a.p.prezzo - b.p.prezzo || a.i - b.i : state.sort === 'down' ? b.p.prezzo - a.p.prezzo || a.i - b.i : a.i - b.i);
    items.forEach((it) => (it.el.hidden = !shown.includes(it)));
    order.forEach((it) => list.insertBefore(it.el, empty));
    empty.hidden = shown.length > 0;
    $('[data-count]').textContent = shown.length === 1 ? '1 piatto' : shown.length + ' piatti';
  }
  // ogni cambio passa per una View Transition: solo i piatti si muovono, il resto della pagina sta fermo
  function run() {
    if (!document.startViewTransition || K.reduced) return apply();
    document.documentElement.classList.add('vt-local');
    const t = document.startViewTransition(apply);
    t.finished.finally(() => document.documentElement.classList.remove('vt-local'));
  }
  apply();
  K.bar('filtri');
  K.reveal();
})();
</script>
</body>
</html>
