<!doctype html>
<html lang="it" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menù: stile Giostra 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/kit.css">
<style>
  /* GIOSTRA 3D: le foto dei piatti su un anello tridimensionale fatto solo di transform CSS.
     Gira scorrendo o trascinando. League Spartan / Figtree, bianco gesso e quattro pastelli, uno per portata. */
  :root {
    --bg: #f7f7f5; --surface: #ebebe8; --ink: #000000; --muted: #5a5a56; --accent: #d0106f; --accent-ink: #ffffff;
    --c1: #97aaf6; --c2: #bbf697; --c3: #fed878; --c4: #6ef8fb;
    --m: clamp(16px, 2.2vw, 32px); --gap: clamp(12px, 1.6vw, 24px);
    --small: 0.9375rem; --body: clamp(1.0625rem, 1rem + 0.2vw, 1.1875rem);
    --lead: clamp(1.375rem, 1.1rem + 0.8vw, 2rem); --head: clamp(3rem, 1rem + 6.6vw, 8rem);
    --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  }
  body { background: var(--bg); color: var(--ink); font: 400 var(--body)/1.5 "Figtree", system-ui, sans-serif; }
  .sp { font-family: "League Spartan", system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; line-height: 0.88; }

  .top { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: end; padding: clamp(48px, 10svh, 120px) var(--m) clamp(24px, 4svh, 48px); }
  .top h1 { grid-column: 1 / span 8; font-size: var(--head); }
  .top p { grid-column: 9 / span 4; font-size: var(--lead); line-height: 1.2; font-weight: 600; }

  .ride { position: relative; }
  .ride__stage { position: sticky; top: 0; height: 100svh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; background: var(--f, var(--surface)); transition: background-color 0.6s; }
  .ride__stage.drag { cursor: grabbing; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: var(--m) var(--m) 0; }
  .tab { min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; transition: transform 0.2s var(--ease); }
  .tab:active { transform: scale(0.95); }
  .tab { background: var(--bg); }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .scene { position: relative; perspective: 1700px; display: grid; place-items: center; }
  .ring { position: relative; width: var(--w); height: calc(var(--w) * 1.25); transform-style: preserve-3d; will-change: transform; }
  .item { position: absolute; inset: 0; transform-style: preserve-3d; }
  .item img { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; pointer-events: none; }
  .item span { position: absolute; left: 0; right: 0; top: calc(100% + 10px); text-align: center; font-size: var(--small); font-weight: 600; visibility: hidden; }
  .item.front span { visibility: visible; }
  .info { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: end; padding: 0 var(--m) var(--m); }
  .info__cat { grid-column: 1 / span 7; justify-self: start; margin-bottom: 12px; padding: 6px 16px; border-radius: 999px; background: var(--bg); font-weight: 600; }
  .info h2 { grid-column: 1 / span 7; font-size: clamp(2.25rem, 1rem + 3.4vw, 4.5rem); }
  .info__right { grid-column: 8 / span 5; grid-row: 2; display: grid; gap: 8px; }
  .info__price { font: 700 var(--lead)/1 "League Spartan", system-ui, sans-serif; color: var(--accent); }
  .swap { animation: pop 0.45s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px); } }

  .all { padding: clamp(120px, 16svh, 200px) var(--m); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 48px; }
  .all > h2 { grid-column: 1 / -1; font-size: var(--head); }
  .all section { grid-column: span 3; padding: 24px; border-radius: 18px; background: var(--f); }
  .all h3 { font-size: var(--lead); margin-bottom: 12px; }
  .all li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .all li span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
  .close { background: var(--ink); color: var(--bg); padding: clamp(64px, 10svh, 120px) var(--m) var(--m); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 28px; }
  .close__name { grid-column: 1 / -1; font-size: clamp(3rem, 1rem + 10vw, 11.5rem); }
  .close p:nth-of-type(2) { grid-column: 1 / span 4; font-size: var(--lead); font-weight: 600; }
  .close p:nth-of-type(3) { grid-column: 7 / span 6; max-width: 52ch; }

  @media (max-width: 1100px) { .top h1, .top p { grid-column: 1 / -1; } .top p { margin-top: 18px; } .all section { grid-column: span 6; } .item.front span { visibility: hidden; } }
  @media (max-width: 760px) {
    .info { grid-template-columns: 1fr; row-gap: 8px; }
    .info__cat, .info h2, .info__right { grid-column: 1; grid-row: auto; }
    .info h2 { font-size: 2.25rem; }
    .all section, .close p:nth-of-type(2), .close p:nth-of-type(3) { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { .swap { animation: none; } .tab, .ride__stage { transition: none; } }
</style>
</head>
<body>
<a class="skip" href="#giostra">Salta al menù</a>
<main>
  <header class="top">
    <h1 class="sp" data-name data-rise></h1>
    <p data-line data-rise></p>
  </header>
  <section class="ride" id="giostra" aria-label="Il menù sulla giostra" data-ride>
    <div class="ride__stage" data-stage>
      <div class="tabs" role="group" aria-label="Vai alla portata" data-tabs></div>
      <div class="scene"><div class="ring" data-ring></div></div>
      <div class="info" aria-live="polite" data-info>
        <p class="info__cat" data-cat></p>
        <h2 class="sp" data-dish></h2>
        <div class="info__right"><p class="info__price" data-price></p><p data-desc></p></div>
      </div>
    </div>
  </section>
  <section class="all" aria-labelledby="all-h">
    <h2 class="sp" id="all-h" data-rise>Tutto il menù</h2>
  </section>
</main>
<footer class="close">
  <p class="close__name sp" data-name></p>
  <p data-cover></p>
  <p data-note></p>
</footer>
<noscript><p style="padding:24px">Questo menù si compone con JavaScript.</p></noscript>
<script src="../js/menu.js"></script>
<script src="../api/menu.js?stile=giostra"></script>
<script src="../js/kit.js"></script>
<script>
(function () {
  'use strict';
  const M = window.MENU, h = K.h, $ = (s) => document.querySelector(s);
  document.querySelectorAll('[data-name]').forEach((e) => (e.textContent = M.ristorante));
  $('[data-line]').textContent = M.stagione + '. Scorri o trascina: il piatto davanti è quello che leggi.';
  $('[data-cover]').textContent = 'Coperto ' + K.euro2(M.coperto);
  $('[data-note]').textContent = M.nota;

  const all = K.all(), N = all.length, STEP = 360 / N;
  const colour = (c) => 'var(--c' + (M.categorie.indexOf(c) % 4 + 1) + ')';
  const ride = $('[data-ride]'), stage = $('[data-stage]'), ring = $('[data-ring]');
  ride.style.height = 'calc(' + (N * 22) + 'svh + 100svh)';
  const items = all.map((p, i) => { const el = h('div', { class: 'item' }, K.photo(p, ''), h('span', { 'aria-hidden': 'true', text: p.nome })); ring.append(el); return el; });

  let W = 220, R = 0;
  function size() {
    W = K.isPhone() ? 150 : Math.round(K.clamp(innerHeight * 0.34, 170, 320));
    R = Math.round((W / 2) / Math.tan(Math.PI / N) + (K.isPhone() ? 10 : 24));
    ring.style.setProperty('--w', W + 'px');
    items.forEach((el, i) => (el.style.transform = 'rotateY(' + (i * STEP) + 'deg) translateZ(' + R + 'px)'));
  }

  const tabs = $('[data-tabs]');
  const tabEls = M.categorie.map((c) => {
    const b = h('button', { class: 'tab', type: 'button', style: '--f:' + colour(c), 'aria-pressed': 'false', text: c.nome });
    b.addEventListener('click', () => goTo(all.findIndex((p) => p.cat === c)));
    tabs.append(b); return b;
  });

  // rotazione = scroll + trascinamento; l'anello insegue il valore con una molla
  let drag = 0, rot = 0, vel = 0, dragging = false, lastX = 0, cur = -1;
  const scrollRot = () => K.progress(ride) * (N - 1) * STEP;
  stage.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; dragging = true; lastX = e.clientX; vel = 0; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', (e) => { if (!dragging) return; const dx = e.clientX - lastX; lastX = e.clientX; drag -= dx * 0.22; vel = -dx * 0.22; });
  const end = () => { if (!dragging) return; dragging = false; stage.classList.remove('drag'); };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  function goTo(n) {
    // porta lo scroll alla posizione del piatto n e azzera il trascinamento
    drag = 0;
    const top = ride.getBoundingClientRect().top + scrollY + (n / (N - 1)) * (ride.offsetHeight - innerHeight);
    scrollTo({ top, behavior: K.reduced ? 'auto' : 'smooth' });
  }

  K.add(ride, () => {
    if (!dragging && Math.abs(vel) > 0.01) { drag += vel; vel *= 0.92; }
    else if (!dragging) { const target = Math.round((scrollRot() + drag) / STEP) * STEP - scrollRot(); drag += (target - drag) * 0.08; }
    const goal = scrollRot() + drag;
    rot += (goal - rot) * (K.reduced ? 1 : 0.12);
    ring.style.transform = 'translateZ(' + (-R) + 'px) rotateY(' + (-rot).toFixed(2) + 'deg)';
    items.forEach((el, i) => {
      const a = ((i * STEP - rot) % 360 + 540) % 360 - 180;
      const c = Math.cos(a * Math.PI / 180);
      const o = (0.25 + 0.75 * (c * 0.5 + 0.5)).toFixed(2);
      if (el.__o !== o) { el.__o = o; el.style.opacity = o; el.classList.toggle('front', c > 0.82); }
    });
    const n = ((Math.round(rot / STEP) % N) + N) % N;
    if (n !== cur) show(n);
  });
  function show(n) {
    cur = n; const p = all[n];
    const info = $('[data-info]');
    stage.style.setProperty('--f', colour(p.cat));
    $('[data-cat]').textContent = p.cat.nome;
    $('[data-dish]').textContent = p.nome;
    $('[data-price]').textContent = K.euro(p.prezzo) + (p.tag.length ? '  ·  ' + p.tag.map((t) => K.tagNames[t]).join(' · ') : '');
    $('[data-desc]').textContent = p.desc;
    [$('[data-dish]'), info.querySelector('.info__right')].forEach((el) => { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); });
    tabEls.forEach((b, i) => b.setAttribute('aria-pressed', String(M.categorie[i] === p.cat)));
  }

  const box = document.querySelector('.all');
  M.categorie.forEach((c) => box.append(h('section', { style: '--f:' + colour(c), 'aria-labelledby': 'a-' + c.id },
    h('h3', { class: 'sp', id: 'a-' + c.id, text: c.nome }), h('ul', {}, c.piatti.map((p) => h('li', {}, h('span', { text: p.nome }), h('span', { text: K.euro(p.prezzo) })))))));
  addEventListener('resize', size);
  size(); show(0);
  K.bar('giostra');
  K.reveal();
})();
</script>
</body>
</html>
