<!doctype html>
<html lang="it" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menù: stile Lista viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/kit.css">
<style>
  /* LISTA VIVA: foto fissa a sinistra, elenco attivo a destra. Young Serif / Source Serif 4, oliva su osso. */
  :root {
    --bg: #ecebe7; --surface: #e1dfd9; --ink: #38450f; --muted: #5d683a; --field: #38450f; --field-ink: #ecebe7;
    --m: clamp(16px, 2.2vw, 32px); --gap: clamp(12px, 1.6vw, 24px);
    --small: 0.9375rem; --body: clamp(1.0625rem, 1rem + 0.2vw, 1.1875rem);
    --lead: clamp(1.375rem, 1.1rem + 0.7vw, 1.875rem); --head: clamp(2.75rem, 1rem + 5.2vw, 6rem);
    --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  }
  body { background: var(--bg); color: var(--ink); font: 400 var(--body)/1.5 "Source Serif 4", Georgia, serif; }
  .serif { font-family: "Young Serif", Georgia, serif; font-weight: 400; letter-spacing: -0.02em; line-height: 0.95; }

  .top { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: end; padding: clamp(48px, 9svh, 110px) var(--m) clamp(40px, 7svh, 80px); }
  .top h1 { grid-column: 1 / span 8; font-size: var(--head); }
  .top__side { grid-column: 9 / span 4; display: grid; gap: 14px; }
  .top__side .where { font-size: var(--lead); font-family: "Young Serif", Georgia, serif; line-height: 1.1; }
  .jump { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: clamp(28px, 4svh, 48px); }
  .jump a { font-size: var(--lead); font-family: "Young Serif", Georgia, serif; text-decoration: none; transition: transform 0.25s var(--ease); display: inline-block; }
  .jump a:hover { transform: translateY(-3px); text-decoration: underline; text-underline-offset: 0.15em; text-decoration-thickness: 2px; }

  .menu { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: start; padding: 0 var(--m) clamp(120px, 16svh, 200px); }
  .aside { grid-column: 1 / span 5; position: sticky; top: 6svh; }
  .photo { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--surface); }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.08); transition: opacity 0.45s, transform 2.4s var(--ease); }
  .photo img.on { opacity: 1; transform: scale(1); }
  .aside figcaption { display: flex; justify-content: space-between; gap: 16px; margin-top: 14px; font-size: var(--small); color: var(--muted); }
  .aside figcaption b { color: var(--ink); font-weight: 600; }

  .list { grid-column: 7 / span 6; }
  .cat + .cat { margin-top: clamp(64px, 10svh, 120px); }
  .cat h2 { font-size: clamp(2.25rem, 1rem + 3vw, 3.75rem); }
  .cat__brief { margin: 10px 0 24px; color: var(--muted); font-style: italic; }
  .dish { padding: 6px 0; }
  .dish__head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; min-height: 52px; color: var(--muted); transition: color 0.25s, transform 0.3s var(--ease); }
  .dish__head:hover { transform: translateX(6px); color: var(--ink); }
  .dish__name { font: 400 var(--lead)/1.1 "Young Serif", Georgia, serif; letter-spacing: -0.01em; }
  .dish__name button { padding: 0; border: 0; background: none; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .dish__price { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .dish.on .dish__head { color: var(--ink); }
  .dish__more { display: none; gap: 8px; max-width: 46ch; margin: 4px 0 18px; }
  .dish.on .dish__more { display: grid; animation: open 0.5s var(--ease); }
  @keyframes open { from { opacity: 0; transform: translateY(-6px); } }
  .dish__pic { display: none; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; font-size: var(--small); }
  .tags span { padding: 2px 10px; background: var(--field); color: var(--field-ink); }

  .close { background: var(--field); color: var(--field-ink); padding: clamp(80px, 12svh, 140px) var(--m) var(--m); display: grid; gap: 40px; }
  .close__name { font-size: clamp(3rem, 1rem + 8.4vw, 9.5rem); }
  .close__info { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); }
  .close__info p:first-child { grid-column: 1 / span 4; font-size: var(--lead); font-family: "Young Serif", Georgia, serif; }
  .close__info p:last-child { grid-column: 7 / span 6; max-width: 52ch; }

  @media (max-width: 1100px) { .top h1 { grid-column: 1 / -1; } .top__side { grid-column: 1 / -1; margin-top: 24px; } .aside { grid-column: 1 / span 6; } .list { grid-column: 7 / span 6; } }
  @media (max-width: 760px) {
    .menu { grid-template-columns: 1fr; }
    .aside { display: none; }
    .list { grid-column: 1; }
    .dish__pic { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; margin-top: 6px; }
    .close__info p:first-child, .close__info p:last-child { grid-column: 1 / -1; }
    .close__info { row-gap: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .photo img, .dish__head, .jump a { transition: none; } .photo img { transform: none; } .dish.on .dish__more { animation: none; } }
</style>
</head>
<body>
<a class="skip" href="#menu">Salta al menù</a>
<main>
  <header class="top">
    <h1 class="serif" data-name data-rise></h1>
    <div class="top__side">
      <p class="where" data-where data-rise></p>
      <p data-note data-rise></p>
    </div>
    <nav class="jump" aria-label="Portate" data-jump></nav>
  </header>
  <section class="menu" id="menu" aria-label="Menù">
    <figure class="aside">
      <div class="photo" data-photo></div>
      <figcaption><b data-cap-name></b><span data-cap-price></span></figcaption>
    </figure>
    <div class="list" data-list></div>
  </section>
</main>
<footer class="close">
  <p class="close__name serif" data-name></p>
  <div class="close__info"><p data-cover></p><p data-note></p></div>
</footer>
<noscript><p style="padding:24px">Questo menù si compone con JavaScript.</p></noscript>
<script src="../js/menu.js"></script>
<script src="../api/menu.js?stile=lista"></script>
<script src="../js/kit.js"></script>
<script>
(function () {
  'use strict';
  const M = window.MENU, h = K.h, $ = (s) => document.querySelector(s);
  document.querySelectorAll('[data-name]').forEach((e) => (e.textContent = M.ristorante));
  document.querySelectorAll('[data-note]').forEach((e) => (e.textContent = M.nota));
  $('[data-where]').textContent = M.luogo + ' · ' + M.stagione;
  $('[data-cover]').textContent = 'Coperto ' + K.euro2(M.coperto);
  const jump = $('[data-jump]');
  M.categorie.forEach((c) => jump.append(h('a', { href: '#' + c.id, text: c.nome })));

  const photo = $('[data-photo]'), list = $('[data-list]');
  const dishes = [];
  M.categorie.forEach((c) => {
    const ul = h('ul');
    c.piatti.forEach((p) => {
      const img = K.photo(p, ''); photo.append(img);
      const head = h('button', { type: 'button', 'aria-expanded': 'false', text: p.nome });
      const li = h('li', { class: 'dish', 'data-rise': true }, h('div', { class: 'dish__head' }, h('h3', { class: 'dish__name' }, head), h('span', { class: 'dish__price', text: K.euro(p.prezzo) })), h('div', { class: 'dish__more' }, h('p', { text: p.desc }), K.tags(p), K.photo(p, 'dish__pic', { loading: 'lazy' })));
      const d = { p, li, head, img };
      head.addEventListener('click', () => { held = performance.now(); set(d); });
      head.addEventListener('focus', () => { held = performance.now(); set(d); });
      head.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { held = performance.now(); set(d); } });
      dishes.push(d); ul.append(li);
    });
    list.append(h('section', { class: 'cat', id: c.id, 'aria-labelledby': 'h-' + c.id },
      h('h2', { class: 'serif', id: 'h-' + c.id, 'data-rise': true, text: c.nome }), h('p', { class: 'cat__brief', 'data-rise': true, text: c.breve }), ul));
  });

  let cur = null, held = 0;
  function set(d) {
    if (cur === d) return;
    if (cur) { cur.li.classList.remove('on'); cur.head.setAttribute('aria-expanded', 'false'); cur.img.classList.remove('on'); }
    cur = d; d.li.classList.add('on'); d.head.setAttribute('aria-expanded', 'true'); d.img.classList.add('on');
    $('[data-cap-name]').textContent = d.p.nome; $('[data-cap-price]').textContent = K.euro(d.p.prezzo);
  }
  addEventListener('scroll', () => {
    if (performance.now() - held < 1500) return;
    const mid = innerHeight * (K.isPhone() ? 0.7 : 0.5);
    let best = null, bd = 1e9;
    for (const d of dishes) { const r = d.head.getBoundingClientRect(); const dd = Math.abs(r.top + r.height / 2 - mid); if (dd < bd) { bd = dd; best = d; } }
    set(best);
  }, { passive: true });
  set(dishes[0]);
  K.bar('lista');
  K.reveal();
})();
</script>
</body>
</html>
