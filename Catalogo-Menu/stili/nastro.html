<!doctype html>
<html lang="it" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menù: stile Nastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/kit.css">
<style>
  /* NASTRO: scendendo, i piatti scorrono di lato sopra una foto ferma. Anton / Work Sans, nero su arancio. */
  :root {
    --bg: #ff7a1f; --surface: #ff8633; --ink: #050f16; --muted: #3d1804; --card: #ffffff; --card-ink: #050f16; --dark: #050f16;
    --m: clamp(16px, 2.2vw, 32px); --gap: clamp(12px, 1.6vw, 24px);
    --small: 0.9375rem; --body: clamp(1.0625rem, 1rem + 0.2vw, 1.1875rem);
    --lead: clamp(1.5rem, 1.1rem + 1.1vw, 2.375rem); --head: clamp(3.5rem, 1rem + 9.6vw, 10.5rem);
    --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  }
  body { background: var(--bg); color: var(--ink); font: 400 var(--body)/1.5 "Work Sans", system-ui, sans-serif; }
  .anton { font-family: "Anton", Impact, sans-serif; font-weight: 400; letter-spacing: -0.01em; line-height: 0.86; text-transform: uppercase; }

  .top { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); min-height: calc(100svh - 56px); padding: var(--m); }
  .top__text { grid-column: 1 / span 7; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
  .top__where { font-size: var(--lead); font-family: "Anton", Impact, sans-serif; text-transform: uppercase; line-height: 1; }
  .top h1 { font-size: var(--head); }
  .top p.intro { max-width: 34ch; font-weight: 600; }
  .top__pic { grid-column: 8 / span 5; position: relative; overflow: hidden; min-height: 60svh; }
  .top__pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .belt { position: relative; }
  .belt__stage { position: sticky; top: 0; height: 100svh; overflow: hidden; background: var(--dark); }
  .belt__ground { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.42) saturate(1.15); transform: scale(1.08); }
  .belt__h { position: absolute; left: var(--m); top: var(--m); z-index: 2; font-size: clamp(3rem, 1rem + 6vw, 7rem); color: var(--bg); will-change: transform; }
  .belt__win { position: absolute; inset: 0; z-index: 3; }
  .belt__track { position: absolute; left: 0; top: 50%; display: flex; gap: 28px; align-items: center; will-change: transform; transform: translate3d(0, -50%, 0); }
  .card { --h: min(560px, 64svh); flex: none; height: var(--h); width: calc(var(--h) * 0.88); display: grid; grid-template-rows: 50% 1fr; background: var(--card); color: var(--card-ink); transition: transform 0.35s var(--ease); }
  .card:hover { transform: translateY(-8px); }
  .card__pic { overflow: hidden; }
  .card__pic img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s var(--ease); }
  .card:hover .card__pic img { transform: scale(1.06); }
  .card__body { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: 20px 22px 22px; }
  .card h3 { font-size: clamp(1.625rem, 1.1rem + 0.9vw, 2.25rem); }
  .card__desc { font-size: var(--body); line-height: 1.35; }
  .card__foot { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
  .card__price { font: 400 clamp(2.25rem, 1.4rem + 1.6vw, 3.25rem)/0.9 "Anton", Impact, sans-serif; }
  .card__tags { font-size: var(--small); font-weight: 600; }
  .card--cat { background: var(--bg); color: var(--ink); grid-template-rows: 1fr auto; padding: 28px; width: calc(var(--h) * 0.62); }
  .card--cat h2 { font-size: clamp(3.25rem, 1rem + 4.4vw, 6rem); align-self: end; }
  .card--cat p { font-weight: 600; margin-top: 16px; }

  .close { padding: clamp(80px, 12svh, 140px) var(--m) var(--m); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 32px; }
  .close__name { grid-column: 1 / -1; font-size: clamp(3.5rem, 1rem + 11vw, 13rem); }
  .close p:not(.close__name):first-of-type { grid-column: 1 / span 4; font: 400 var(--lead)/1 "Anton", Impact, sans-serif; text-transform: uppercase; }
  .close p:last-child { grid-column: 7 / span 6; max-width: 52ch; font-weight: 600; }

  @media (max-width: 760px) {
    .top { grid-template-columns: 1fr; min-height: 0; row-gap: 28px; padding-top: 32px; }
    .top__text, .top__pic { grid-column: 1; }
    .top__pic { min-height: 0; aspect-ratio: 4 / 5; }
    .belt { height: auto !important; }
    .belt__stage { position: relative; height: auto; overflow: visible; background: none; padding: 56px var(--m) 0; }
    .belt__ground { display: none; }
    .belt__h { position: relative; left: auto; top: auto; color: var(--ink); transform: none !important; margin-bottom: 24px; }
    .belt__win { position: relative; inset: auto; }
    .belt__track { position: relative; top: auto; flex-direction: column; align-items: stretch; transform: none !important; gap: 20px; }
    .card { --h: auto; width: 100% !important; height: auto; opacity: 1 !important; visibility: visible !important; }
    .card__pic { aspect-ratio: 4 / 3; }
    .card--cat { min-height: 0; margin-top: 72px; padding: 0; background: none; }
    .card--cat h2 { font-size: 3.5rem; }
    .close p:not(.close__name):first-of-type, .close p:last-child { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { .card, .card__pic img { transition: none; } }
</style>
</head>
<body>
<a class="skip" href="#menu">Salta al menù</a>
<main>
  <header class="top">
    <div class="top__text">
      <p class="top__where" data-where data-rise></p>
      <div>
        <h1 class="anton" data-name data-rise></h1>
        <p class="intro" data-rise>Sedici piatti, quattro portate. Scendi e il menù ti passa davanti, un piatto alla volta.</p>
      </div>
    </div>
    <figure class="top__pic" data-rise><img src="../assets/carbonara.jpg" alt="Un piatto di spaghetti alla carbonara" width="1400" height="1050"></figure>
  </header>
  <section class="belt" id="menu" aria-labelledby="menu-h" data-belt>
    <div class="belt__stage">
      <img class="belt__ground" src="../assets/tavola.jpg" alt="" width="1400" height="933">
      <h2 class="belt__h anton" id="menu-h" data-belt-h>Il menù</h2>
      <div class="belt__win"><div class="belt__track" data-track></div></div>
    </div>
  </section>
</main>
<footer class="close">
  <p class="close__name anton" data-name></p>
  <p data-cover></p>
  <p data-note></p>
</footer>
<noscript><p style="padding:24px">Questo menù si compone con JavaScript.</p></noscript>
<script src="../js/menu.js"></script>
<script src="../api/menu.js?stile=nastro"></script>
<script src="../js/kit.js"></script>
<script>
(function () {
  'use strict';
  const M = window.MENU, h = K.h, $ = (s) => document.querySelector(s);
  document.querySelectorAll('[data-name]').forEach((e) => (e.textContent = M.ristorante));
  $('[data-where]').textContent = M.luogo + ' · ' + M.stagione;
  $('[data-cover]').textContent = 'Coperto ' + K.euro2(M.coperto);
  $('[data-note]').textContent = M.nota;

  const track = $('[data-track]'), belt = $('[data-belt]'), head = $('[data-belt-h]');
  M.categorie.forEach((c) => {
    track.append(h('section', { class: 'card card--cat', 'aria-labelledby': 'h-' + c.id }, h('h2', { class: 'anton', id: 'h-' + c.id, text: c.nome }), h('p', { text: c.breve })));
    c.piatti.forEach((p) => track.append(h('article', { class: 'card' },
      h('div', { class: 'card__pic' }, K.photo(p, '')),
      h('div', { class: 'card__body' },
        h('div', {}, h('h3', { class: 'anton', text: p.nome }), h('p', { class: 'card__desc', text: p.desc })),
        h('div', { class: 'card__foot' }, h('p', { class: 'card__tags', text: p.tag.map((t) => K.tagNames[t]).join(' · ') }), h('p', { class: 'card__price', text: K.euro(p.prezzo) }))))));
  });

  // la sezione è alta quanto serve perché il nastro scorra tutto, a 1,8 volte la velocità dello scroll
  const SPEED = 1.8;
  let travel = 0, startX = 0;
  function size() {
    if (K.isPhone()) { belt.style.height = ''; return; }
    startX = innerWidth * 0.62;
    const last = track.lastElementChild;
    travel = startX + last.offsetLeft - (innerWidth - last.offsetWidth) / 2;
    belt.style.height = (travel / SPEED + innerHeight) + 'px';
  }
  const cards = Array.from(track.children);
  function update() {
    if (K.isPhone()) return;
    const p = K.progress(belt);
    const x = startX - travel * p;
    const m = head.offsetLeft;
    track.style.transform = 'translate3d(' + x.toFixed(1) + 'px,-50%,0)';
    const room = Math.min(0, x - (m + head.offsetWidth + 40));
    head.style.transform = 'translate3d(' + room.toFixed(1) + 'px,0,0)';
    head.style.visibility = room < -(m + head.offsetWidth) ? 'hidden' : 'visible';
    // le carte sfumano vicino ai margini, a sinistra quando escono e a destra quando entrano
    for (const c of cards) {
      const left = x + c.offsetLeft, w = c.offsetWidth;
      // piena dentro i margini, trasparente prima che il suo testo arrivi al bordo dello schermo
      const span = m + 6 + w * 0.25;
      const oL = (left + 6) / span, oR = (innerWidth + 6 - (left + w)) / span;
      const o = K.clamp(Math.min(oL, oR), 0, 1), v = o.toFixed(2);
      if (c.__o !== v) { c.__o = v; c.style.opacity = v; c.style.visibility = o === 0 ? 'hidden' : 'visible'; }
    }
  }
  // aggiornato sia a ogni fotogramma sia a ogni evento di scroll, così non resta mai indietro
  K.add(belt, update);
  addEventListener('scroll', update, { passive: true });
  addEventListener('resize', () => { size(); update(); });
  if (document.fonts) document.fonts.ready.then(() => { size(); update(); });
  size(); update();
  K.bar('nastro');
  K.reveal();
})();
</script>
</body>
</html>
