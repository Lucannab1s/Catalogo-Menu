<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestione piatti</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #a8a8aa; --surface: #b4b4b6; --card: #c2c2c4; --ink: #0e0e0e; --muted: #2f2f31;
    --accent: #1f5c49; --accent-ink: #fff; --field: #1b1b1c; --field-ink: #fff; --danger: #8a1f1f;
    --m: clamp(16px, 2.2vw, 32px); --gap: clamp(12px, 1.6vw, 24px);
    --small: 0.9375rem; --body: clamp(1rem, 0.96rem + 0.2vw, 1.0625rem);
    --lead: clamp(1.25rem, 1.05rem + 0.8vw, 1.75rem); --head: clamp(2.25rem, 1rem + 4.4vw, 4.5rem);
    --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 var(--body)/1.45 "Hanken Grotesk", system-ui, sans-serif; padding: 0 var(--m) 96px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  img { display: block; max-width: 100%; }

  .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px; padding: clamp(32px, 6svh, 72px) 0 28px; }
  .top h1 { font-size: var(--head); font-weight: 500; letter-spacing: -0.05em; line-height: 0.9; }
  .top a { color: var(--ink); }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 28px; scrollbar-width: thin; }
  .tab { flex: none; min-height: 44px; padding: 0 16px; border: 0; background: var(--surface); cursor: pointer; white-space: nowrap; transition: background-color 0.2s; }
  .tab:hover { background: var(--card); }
  .tab[aria-selected="true"] { background: var(--field); color: var(--field-ink); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: clamp(24px, 3vw, 48px); align-items: start; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .bar p { color: var(--muted); font-size: var(--small); }
  .bar .acts { display: flex; flex-wrap: wrap; gap: 8px; }

  .cat + .cat { margin-top: 36px; }
  .cat h2 { font-size: var(--lead); font-weight: 500; letter-spacing: -0.03em; margin-bottom: 10px; }
  .cat ul { list-style: none; padding: 0; display: grid; gap: 6px; }
  .empty { color: var(--muted); font-size: var(--small); padding: 10px 0; }
  .dish { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px; background: var(--surface); transition: opacity 0.2s; }
  .dish img { width: 72px; height: 54px; object-fit: cover; background: var(--field); }
  .dish__name { font-weight: 600; }
  .dish__meta { font-size: var(--small); color: var(--muted); }
  .dish.off { background: transparent; outline: 1px dashed var(--muted); outline-offset: -1px; }
  .dish.off img, .dish.off .dish__text { opacity: 0.5; }
  .dish__badge { display: inline-block; margin-left: 6px; padding: 1px 7px; background: var(--field); color: var(--field-ink); font-size: 0.8125rem; font-weight: 500; vertical-align: 2px; }
  .dish__acts { display: flex; gap: 6px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 500; text-decoration: none; cursor: pointer; transition: transform 0.15s var(--ease), background-color 0.2s; }
  .btn:hover { background: #17483a; }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { background: var(--surface); color: var(--muted); cursor: default; transform: none; }
  .btn--ghost { background: var(--field); color: var(--field-ink); }
  .btn--ghost:hover { background: #000; }
  .btn--line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .btn--line:hover { background: var(--card); }
  .btn--danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
  .btn--danger:hover { background: var(--danger); color: #fff; }
  .btn--sm { min-height: 38px; padding: 0 12px; font-size: var(--small); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .add { position: sticky; top: 16px; background: var(--field); color: var(--field-ink); padding: clamp(20px, 2vw, 28px); display: grid; gap: 14px; }
  .add h2 { font-size: var(--lead); font-weight: 500; letter-spacing: -0.03em; }
  .add label, .add fieldset { display: grid; gap: 6px; font-size: var(--small); color: #d6d6d8; border: 0; padding: 0; }
  .add legend { padding: 0; margin-bottom: 6px; }
  .add input[type=text], .add input[type=number], .add textarea, .add select { width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-radius: 0; background: #2c2c2e; color: #fff; font-size: 16px; }
  .add textarea { min-height: 84px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checks { display: flex; flex-wrap: wrap; gap: 16px; color: #fff; }
  .checks label { display: flex; align-items: center; gap: 8px; color: #fff; font-size: var(--body); cursor: pointer; }
  .checks input { width: 20px; height: 20px; accent-color: #3d9c7f; }
  .pick { display: flex; gap: 6px; }
  .pick button { flex: 1; min-height: 40px; border: 0; background: #2c2c2e; color: #d6d6d8; cursor: pointer; }
  .pick button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .preview { aspect-ratio: 4 / 3; width: 100%; object-fit: cover; background: #2c2c2e; }
  .add input[type=file] { font-size: var(--small); color: #d6d6d8; }
  .add .btn { width: 100%; }

  .msg { position: fixed; left: 50%; bottom: 20px; z-index: 9; max-width: calc(100% - 32px); padding: 12px 18px; background: var(--field); color: var(--field-ink); transform: translate(-50%, 140%); transition: transform 0.35s var(--ease); }
  .msg.on { transform: translate(-50%, 0); }
  .msg.err { background: var(--danger); }

  .gate { min-height: 70svh; display: grid; place-items: center; }
  .gate form { width: min(100%, 380px); background: var(--field); color: var(--field-ink); padding: 28px; display: grid; gap: 14px; }
  .gate h2 { font-size: var(--lead); font-weight: 500; letter-spacing: -0.03em; }
  .gate label { display: grid; gap: 6px; font-size: var(--small); color: #d6d6d8; }
  .gate input { min-height: 44px; padding: 10px 12px; border: 0; background: #2c2c2e; color: #fff; font-size: 16px; }
  .top__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .top__acts button { border: 0; background: none; padding: 0; text-decoration: underline; cursor: pointer; }
  [hidden] { display: none !important; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .add { position: static; order: -1; }
  }
  @media (max-width: 520px) {
    .dish { grid-template-columns: 56px minmax(0, 1fr); }
    .dish img { width: 56px; height: 42px; }
    .dish__acts { grid-column: 1 / -1; }
    .dish__acts .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .btn, .msg, .tab, .dish { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <h1>Gestione piatti</h1>
  <p class="top__acts"><a href="../index.html">← Torna al catalogo</a><button type="button" data-logout hidden>Esci</button></p>
</header>

<section class="gate" data-gate hidden>
  <form data-login>
    <h2>Accedi</h2>
    <label>Password di gestione <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Entra</button>
  </form>
</section>

<div data-app hidden>
<nav class="tabs" role="tablist" aria-label="Stile da gestire" data-tabs></nav>

<div class="layout">
  <main>
    <div class="bar">
      <p data-count></p>
      <div class="acts">
        <a class="btn btn--ghost btn--sm" href="#" target="_blank" rel="noopener" data-open>Apri lo stile ↗</a>
        <button class="btn btn--line btn--sm" type="button" data-reset>Ripristina il menù di partenza</button>
      </div>
    </div>
    <div data-cats aria-live="polite"></div>
  </main>

  <form class="add" data-form novalidate>
    <h2>Nuovo piatto</h2>
    <label>Portata <select name="cat" data-cat-select required></select></label>
    <label>Nome <input type="text" name="nome" maxlength="80" required autocomplete="off"></label>
    <label>Descrizione <textarea name="desc" maxlength="300" required></textarea></label>
    <div class="row2">
      <label>Prezzo (€) <input type="number" name="prezzo" min="0" max="10000" step="0.5" inputmode="decimal" required></label>
      <label>Visibilità
        <select name="nascosto"><option value="">Visibile</option><option value="1">Nascosto</option></select>
      </label>
    </div>
    <fieldset class="checks"><legend>Etichette</legend>
      <label><input type="checkbox" name="tag" value="v"> Vegetariano</label>
      <label><input type="checkbox" name="tag" value="gf"> Senza glutine</label>
    </fieldset>
    <fieldset>
      <legend>Foto</legend>
      <div class="pick" role="group">
        <button type="button" aria-pressed="true" data-mode="lista">Dalle foto esistenti</button>
        <button type="button" aria-pressed="false" data-mode="file">Carica una foto</button>
      </div>
      <select name="foto" data-foto-select aria-label="Foto esistente"></select>
      <input type="file" accept="image/jpeg,image/png,image/webp" data-file hidden aria-label="Foto da caricare">
      <img class="preview" alt="Anteprima della foto scelta" data-preview>
    </fieldset>
    <button class="btn" type="submit">Aggiungi al menù</button>
  </form>
</div>
</div>

<p class="msg" role="status" data-msg></p>

<script src="../js/menu.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v; else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  };
  const fmt = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 2 });
  const euro = (n) => fmt.format(n) + ' €';
  const TAGS = { v: 'Vegetariano', gf: 'Senza glutine' };
  const STILI = window.STILI;

  let stile = (location.hash.slice(1) && STILI.some((s) => s.id === location.hash.slice(1))) ? location.hash.slice(1) : STILI[0].id;
  let menu = null, mode = 'lista', fileData = null;

  /* ---------- messaggi ---------- */
  let msgT = 0;
  function say(text, err) {
    const m = $('[data-msg]'); m.textContent = text; m.classList.toggle('err', !!err); m.classList.add('on');
    clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove('on'), err ? 5000 : 2600);
  }

  async function call(method, url, body) {
    const r = await fetch(location.origin + url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401 && url !== '/api/login') { showGate(true); throw new Error('Accedi per continuare.'); }
    if (!r.ok) throw new Error(data.errore || 'Errore ' + r.status);
    return data;
  }
  const q = () => '?stile=' + encodeURIComponent(stile);

  /* ---------- schede degli stili ---------- */
  const tabs = $('[data-tabs]');
  STILI.forEach((s) => {
    const b = h('button', { class: 'tab', type: 'button', role: 'tab', 'aria-selected': String(s.id === stile), 'data-id': s.id, text: s.nome });
    b.addEventListener('click', () => { stile = s.id; history.replaceState(null, '', '#' + s.id); syncTabs(); load(); });
    tabs.append(b);
  });
  function syncTabs() { tabs.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.id === stile))); }

  /* ---------- elenco ---------- */
  async function load() {
    $('[data-open]').href = '../stili/' + stile + '.html';
    try { menu = await call('GET', '/api/admin/menu' + q()); render(); } catch (e) { say(e.message, true); }
  }
  function render() {
    const wrap = $('[data-cats]'); wrap.textContent = '';
    let tot = 0, hidden = 0;
    menu.categorie.forEach((c) => {
      tot += c.piatti.length; hidden += c.piatti.filter((p) => p.nascosto).length;
      wrap.append(h('section', { class: 'cat' }, h('h2', { text: c.nome }),
        c.piatti.length ? h('ul', {}, c.piatti.map(dishRow)) : h('p', { class: 'empty', text: 'Nessun piatto: la portata non compare nel menù.' })));
    });
    const s = STILI.find((x) => x.id === stile);
    $('[data-count]').textContent = s.nome + ': ' + tot + (tot === 1 ? ' piatto' : ' piatti') + (hidden ? ', ' + hidden + (hidden === 1 ? ' nascosto' : ' nascosti') : '');
    const sel = $('[data-cat-select]'), prev = sel.value; sel.textContent = '';
    menu.categorie.forEach((c) => sel.append(h('option', { value: c.id, text: c.nome })));
    if (prev && menu.categorie.some((c) => c.id === prev)) sel.value = prev;
  }
  function dishRow(p) {
    const hide = h('button', { class: 'btn btn--line btn--sm', type: 'button', text: p.nascosto ? 'Mostra' : 'Nascondi' });
    const del = h('button', { class: 'btn btn--danger btn--sm', type: 'button', text: 'Elimina' });
    hide.addEventListener('click', async () => {
      hide.disabled = true;
      try { await call('PATCH', '/api/admin/piatti/' + encodeURIComponent(p.id) + q(), { nascosto: !p.nascosto }); say(p.nome + (p.nascosto ? ' è di nuovo visibile.' : ' è nascosto.')); await load(); }
      catch (e) { say(e.message, true); hide.disabled = false; }
    });
    del.addEventListener('click', async () => {
      if (!confirm('Eliminare "' + p.nome + '" dal menù di questo stile? Non si può annullare.')) return;
      del.disabled = true;
      try { await call('DELETE', '/api/admin/piatti/' + encodeURIComponent(p.id) + q()); say(p.nome + ' eliminato.'); await load(); }
      catch (e) { say(e.message, true); del.disabled = false; }
    });
    return h('li', { class: 'dish' + (p.nascosto ? ' off' : '') },
      h('img', { src: '../assets/' + p.foto, alt: '', loading: 'lazy', width: 72, height: 54 }),
      h('div', { class: 'dish__text' },
        h('p', { class: 'dish__name' }, p.nome, p.nascosto ? h('span', { class: 'dish__badge', text: 'Nascosto' }) : null),
        h('p', { class: 'dish__meta', text: [euro(p.prezzo)].concat(p.tag.map((t) => TAGS[t])).join(' · ') })),
      h('div', { class: 'dish__acts' }, hide, del));
  }

  $('[data-reset]').addEventListener('click', async () => {
    if (!confirm('Rimettere il menù di partenza in questo stile? I piatti aggiunti, nascosti o eliminati qui tornano come all\'inizio.')) return;
    try { await call('POST', '/api/admin/piatti/ripristina' + q()); say('Menù ripristinato.'); await load(); } catch (e) { say(e.message, true); }
  });

  /* ---------- foto del nuovo piatto ---------- */
  const fotoSel = $('[data-foto-select]'), fileIn = $('[data-file]'), preview = $('[data-preview]');
  function showPreview() {
    if (mode === 'lista') { preview.src = fotoSel.value ? '../assets/' + fotoSel.value : ''; preview.hidden = !fotoSel.value; }
    else { preview.hidden = !fileData; if (fileData) preview.src = fileData; }
  }
  async function loadPhotos(select) {
    try {
      const list = await call('GET', '/api/admin/foto');
      fotoSel.textContent = '';
      list.forEach((f) => fotoSel.append(h('option', { value: f, text: f.replace(/\.(jpe?g|png|webp)$/i, '') })));
      if (select) fotoSel.value = select;
      showPreview();
    } catch (e) { say(e.message, true); }
  }
  fotoSel.addEventListener('change', showPreview);
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    fotoSel.hidden = mode !== 'lista'; fileIn.hidden = mode !== 'file';
    showPreview();
  }));
  fileIn.addEventListener('change', () => {
    const f = fileIn.files[0]; fileData = null;
    if (!f) return showPreview();
    if (f.size > 5 * 1024 * 1024) { say('La foto supera 5 MB.', true); fileIn.value = ''; return showPreview(); }
    const r = new FileReader();
    r.onload = () => { fileData = r.result; showPreview(); };
    r.readAsDataURL(f);
  });

  /* ---------- aggiungere ---------- */
  const form = $('[data-form]');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = {
      cat: fd.get('cat'), nome: fd.get('nome'), desc: fd.get('desc'), prezzo: fd.get('prezzo') === '' ? NaN : Number(fd.get('prezzo')),
      tag: fd.getAll('tag'), nascosto: fd.get('nascosto') === '1',
    };
    if (!String(body.nome).trim()) return say('Scrivi il nome del piatto.', true);
    if (!String(body.desc).trim()) return say('Scrivi una descrizione.', true);
    if (!Number.isFinite(body.prezzo) || body.prezzo < 0) return say('Scrivi un prezzo valido.', true);
    if (mode === 'file') { if (!fileData) return say('Scegli la foto da caricare.', true); body.fotoData = fileData; }
    else body.foto = fotoSel.value;
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try {
      const p = await call('POST', '/api/admin/piatti' + q(), body);
      say(p.nome + ' aggiunto.');
      const keepCat = fd.get('cat');
      form.reset(); form.querySelector('[name=cat]').value = keepCat;
      fileIn.value = ''; fileData = null;
      await Promise.all([load(), mode === 'file' ? loadPhotos(fotoSel.value) : Promise.resolve()]);
      showPreview();
    } catch (err) { say(err.message, true); }
    finally { btn.disabled = false; }
  });

  /* ---------- accesso ---------- */
  function showGate(on) {
    $('[data-gate]').hidden = !on; $('[data-app]').hidden = on; $('[data-logout]').hidden = on;
    if (on) $('[data-login] input').focus();
  }
  $('[data-login]').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = e.target.elements.password;
    try { await call('POST', '/api/login', { password: input.value }); input.value = ''; showGate(false); await start(); }
    catch (err) { say(err.message, true); input.select(); }
  });
  $('[data-logout]').addEventListener('click', async () => { try { await call('POST', '/api/logout'); } catch (e) { /* già fuori */ } showGate(true); });
  async function start() { syncTabs(); await Promise.all([load(), loadPhotos()]); }

  if (location.protocol === 'file:') say('Apri questa pagina dal server: npm start, poi http://localhost:3000/admin/', true);
  else call('GET', '/api/admin/stili').then(() => { showGate(false); start(); }).catch(() => showGate(true));
})();
</script>
</body>
</html>
